<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>往期日报 - 每日新闻</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="page-wrapper">
    <header class="site-header">
      <div class="container">
        <div class="header-inner">
          <a href="/" class="brand">
            <img src="/favicon.svg" alt="每日新闻" class="brand-icon" width="28" height="28">
            <span class="brand-name">每日新闻</span>
          </a>
          <nav class="header-nav">
            <a href="/" class="nav-link">最新日报</a>
            <a href="/archives" class="nav-link active">往期日报</a>
          </nav>
        </div>
      </div>
    </header>
    
    <main class="main-content">
      <div class="container">
        <div class="archives-layout">
          <header class="archives-header">
            <h1 class="archives-title">往期日报</h1>
            <p class="archives-subtitle">浏览历史日报，回顾每日科技动态</p>
          </header>
          
          <div class="archives-grid">
            {{#each reports}}
            <a href="/archives/{{this.date}}" class="archive-card">
              <div class="archive-date">{{this.displayDate}}</div>
              <div class="archive-meta">{{this.newsCount}} 条新闻</div>
              <div class="archive-preview">{{this.preview}}</div>
            </a>
            {{/each}}
          </div>
          
          {{#if noReports}}
          <div class="empty-state">
            <p>暂无往期日报</p>
          </div>
          {{/if}}
        </div>
      </div>
    </main>
    
    <footer class="site-footer">
      <div class="container">
        <div class="footer-inner">
          <p class="footer-text">由每日新闻日报系统自动生成</p>
          <p class="footer-text">数据来源于公开 RSS 订阅源</p>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
