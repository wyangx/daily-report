<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="page-wrapper">
    <header class="site-header">
      <div class="container">
        <div class="header-inner">
          <a href="/" class="brand">
            <img src="/favicon.svg" alt="每日新闻" class="brand-icon" width="28" height="28">
            <span class="brand-name">每日新闻</span>
          </a>
          <nav class="header-nav">
            <a href="/" class="nav-link active">最新日报</a>
            <a href="/archives" class="nav-link">往期日报</a>
          </nav>
          <div class="theme-toggle">
            <button class="theme-toggle-btn" id="theme-toggle" aria-label="切换主题">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"/>
                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
              </svg>
            </button>
            <div class="theme-dropdown" id="theme-dropdown">
              <button class="theme-option" data-theme="light">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="5"/>
                  <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
                亮色模式
              </button>
              <button class="theme-option" data-theme="dark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
                暗色模式
              </button>
              <button class="theme-option" data-theme="system">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                  <path d="M8 21h8M12 17v4"/>
                </svg>
                跟随系统
              </button>
            </div>
          </div>
          <time class="header-date" datetime="{{isoDate}}">{{date}}</time>
        </div>
      </div>
    </header>
    
    <main class="main-content">
      <div class="container">
        <div class="layout">
          <aside class="sidebar" aria-label="新闻来源导航">
            <div class="sidebar-sticky">
              <h2 class="sidebar-title">来源</h2>
              <nav class="source-nav">
                <ul class="source-list">
                  {{#each sources}}
                  <li><a href="#source-{{this}}" class="source-link">{{this}}</a></li>
                  {{/each}}
                </ul>
              </nav>
              <div class="sidebar-footer">
                <p class="update-info">更新于 {{updateTime}}</p>
              </div>
            </div>
          </aside>
          
          <article class="article-content">
            <header class="article-header">
              <h1 class="article-title">{{title}}</h1>
              <p class="article-meta">{{newsCount}} 条新闻 · AI 智能总结</p>
            </header>
            
            <div class="article-body markdown-body">
              {{{content}}}
            </div>
          </article>
        </div>
      </div>
    </main>
    
    <footer class="site-footer">
      <div class="container">
        <div class="footer-inner">
          <p class="footer-text">由每日新闻日报系统自动生成</p>
          <p class="footer-text">数据来源于公开 RSS 订阅源</p>
        </div>
      </div>
    </footer>
  </div>
  
  <button class="back-to-top" aria-label="返回顶部" hidden>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 19V5M5 12l7-7 7 7"/>
    </svg>
  </button>
  
  <script src="/js/app.js"></script>
</body>
</html>
